[package]
name = "rspass"
version = "0.0.8"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Rust based clone of pass(1), the standard unix password manager"
license = "MIT"
repository = "https://github.com/veltzer/rspass"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tera = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
which = "8"
chrono = "0.4.43"
tempfile = "3.8"
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# The pedantic/nursery allow list, copied from rsconstruct's policy: every
# entry is a decision, not a backlog item. The bar for adding here is:
# clippy's preferred form is not clearly better, AND the lint fires broadly
# enough that per-site `#[allow]`s would be worse than one crate-level entry.

# Numeric casts on human-facing values (lengths, line numbers) where the
# range is known-small and a lossy cast is the intent.
cast_possible_truncation = "allow"
# Match arms are kept separate when they mean different things, even where
# they currently share a body.
match_same_arms = "allow"
# Suggests `map_or`/`map_or_else`, which is less readable than `if let`
# once the branches are more than an expression each.
option_if_let_else = "allow"
# Fires on the CLI dispatch match in main.rs and the per-command handlers.
# These are flat dispatch tables; splitting them produces indirection
# without reducing the amount to read.
too_many_lines = "allow"
# CLI argument structs are flag bags by nature — clap derives one bool per
# `--flag`. Grouping them into sub-structs to satisfy a 3-bool limit would
# obscure the one-field-per-option mapping that makes them readable.
struct_excessive_bools = "allow"
# Command handlers take many primitives because each maps 1:1 to a CLI flag.
fn_params_excessive_bools = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# Shipped-binary-equivalent build with debug symbols for profiling (samply/perf).
# Usage: `cargo build --profile profiling`; binary lands in target/profiling/.
[profile.profiling]
inherits = "dist"
strip = false
debug = true
