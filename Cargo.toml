[package]
name = "rspass"
version = "0.0.8"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Rust based clone of pass(1), the standard unix password manager"
license = "MIT"
repository = "https://github.com/veltzer/rspass"
keywords = ["password", "pass", "gpg"]
categories = ["authentication", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tera = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
which = "8"
chrono = "0.4.43"
tempfile = "3.8"
rpassword = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# clippy's cargo group, lint by lint: the manifest's metadata, features and
# dependencies. multiple_crate_versions is not among them: every duplicate
# comes from upstream (deny.toml, where it is a warning, says the same).
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
# clippy restriction lints, named one by one: leftovers that must not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# Shipped-binary-equivalent build with debug symbols for profiling (samply/perf).
# Usage: `cargo build --profile profiling`; binary lands in target/profiling/.
[profile.profiling]
inherits = "dist"
strip = false
debug = true
