name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # rspass shells out to gpg for all encryption, exactly like pass(1).
      # ubuntu-latest ships gnupg, but install explicitly so a runner image
      # change fails here with a clear message instead of inside the tests.
      - name: Install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
